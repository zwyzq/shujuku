{% extends "base.html" %}
{% block title %}登录 · 问卷系统{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto 0;">
  <h1>登录 / 注册</h1>
  <p class="muted">阶段一演示账号，数据存在本地 MongoDB。</p>
  <div class="tabs">
    <button type="button" class="btn secondary active" id="tab-login">登录</button>
    <button type="button" class="btn secondary" id="tab-reg">注册</button>
  </div>
  <form id="form-login">
    <label>用户名</label>
    <input type="text" name="username" required autocomplete="username">
    <label>密码</label>
    <input type="password" name="password" required autocomplete="current-password">
    <div id="reg-extra" class="hidden">
      <label>邮箱（可选）</label>
      <input type="email" name="email" autocomplete="email">
    </div>
    <div style="margin-top:16px;" class="row">
      <button class="btn" type="submit" id="submit-btn">登录</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
let mode = "login";
const tabLogin = $("#tab-login");
const tabReg = $("#tab-reg");
const extra = $("#reg-extra");
const btn = $("#submit-btn");
const msg = $("#msg");

tabLogin.onclick = () => {
  mode = "login";
  tabLogin.classList.add("active");
  tabReg.classList.remove("active");
  extra.classList.add("hidden");
  btn.textContent = "登录";
  msg.textContent = "";
};
tabReg.onclick = () => {
  mode = "register";
  tabReg.classList.add("active");
  tabLogin.classList.remove("active");
  extra.classList.remove("hidden");
  btn.textContent = "注册";
  msg.textContent = "";
};

$("#form-login").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = {
    username: fd.get("username").trim(),
    password: fd.get("password"),
  };
  if (mode === "register") payload.email = (fd.get("email") || "").trim();
  try {
    await api("POST", mode === "login" ? "/api/auth/login" : "/api/auth/register", payload);
    location.href = "/";
  } catch (err) {
    showMsg(msg, err.message || "失败", false);
  }
};
</script>
{% endblock %}
